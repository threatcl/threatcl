# Static analysis of the GitHub Actions workflows themselves (template
# injection, credential persistence, cache poisoning, unpinned actions, …).
# The workflows are the release pipeline's control plane — a bug here is a
# supply-chain bug. Findings are uploaded as SARIF to code scanning.
name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF findings to code scanning
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Pin the analyzer itself, not just the action wrapper.
          version: '1.26.1'
